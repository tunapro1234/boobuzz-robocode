// :sim — L1 simulator adapter. Pure Java, no FTC SDK.
// Depends on :core; never on TeamCode.
plugins {
    id 'java-library'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':core')
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'boobuzz.sim.SimMain'
}

tasks.named('run') {
    workingDir rootProject.projectDir
}

tasks.named('test') { useJUnit() }

apply from: rootProject.file('gradle/sdk-guard.gradle')
