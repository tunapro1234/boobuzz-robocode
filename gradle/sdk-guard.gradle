// Constitution rule 1 (architecture documentation, §2): L2/L3 must not import the FTC SDK.
// This file turns the rule from discipline into a BUILD ERROR.
// It runs BEFORE compileJava; a violation stops the build there.

def forbidden = ~/com\.qualcomm|org\.firstinspires|android\./

def guard = tasks.register('sdkGuard') {
    description = 'Searches sources for FTC SDK / Android references and fails the build if found.'
    group = 'verification'

    def javaFiles = sourceSets.main.java.asFileTree + sourceSets.test.java.asFileTree
    inputs.files(javaFiles).withPathSensitivity(PathSensitivity.RELATIVE)
    def marker = layout.buildDirectory.file('sdk-guard.ok')
    outputs.file(marker)
    def projectName = project.name
    def rootDir = project.rootDir

    doLast {
        def hits = []
        javaFiles.each { f ->
            f.eachLine('UTF-8') { line, n ->
                if (forbidden.matcher(line).find()) {
                    hits << "  ${rootDir.toPath().relativize(f.toPath())}:${n}: ${line.trim()}"
                }
            }
        }
        if (!hits.isEmpty()) {
            throw new GradleException(
                "\n:${projectName} contains an FTC SDK / Android reference (constitution rule 1).\n" +
                "This module must be pure Java; hardware code belongs in TeamCode.\n" +
                hits.join('\n') + '\n')
        }
        def out = marker.get().asFile
        out.parentFile.mkdirs()
        out.text = "ok\n"
    }
}

tasks.named('compileJava') { dependsOn guard }
