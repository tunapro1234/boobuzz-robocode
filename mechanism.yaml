# Tek gercek kaynak: sim geometrisi VE gercek robotun koordinat matematigi.
# Java (:core, :sim) ve Python (re-cock-nize) AYNI dosyayi okur.
# Sema ve cerceve kurali docs/protokol.md'de. Dosyada aci DERECE, protokolde RADYAN.
#
# Cerceve: robot +x ILERI, +y SOL, donus CCW pozitif (Pedro/FTC ile ayni).
# Faz 0/1: sadece dort tekerlek. Shooter/turret/tof/limelight eklendiginde
# buraya girer, protokol degismez.

units: {length: in, angle: deg}          # dosyada derece; PROTOKOLDE RADYAN
robot: {width: 18, length: 18}            # ayak izi; duvar kirpma + cizim
frames:
  robot:  {parent: field}
drivetrain: {type: mecanum, track_width: 13.0, wheel_base: 11.0, wheel_diameter: 4.0}
motors:                                   # ad = protokol anahtari
  # pos = [x ileri, y sol] robot cercevesi
  fl: {drives: wheel, pos: [ 6.5, 5.5], roller: 45,  ticks_per_rev: 537.7, free_rpm: 312, kV: 0.0, kS: 0.0}
  fr: {drives: wheel, pos: [ 6.5,-5.5], roller: -45, ticks_per_rev: 537.7, free_rpm: 312, kV: 0.0, kS: 0.0}
  bl: {drives: wheel, pos: [-6.5, 5.5], roller: -45, ticks_per_rev: 537.7, free_rpm: 312, kV: 0.0, kS: 0.0}
  br: {drives: wheel, pos: [-6.5,-5.5], roller: 45,  ticks_per_rev: 537.7, free_rpm: 312, kV: 0.0, kS: 0.0}
servos: {}
sensors:
  imu: {parent: robot}
  pinpoint: {parent: robot, xyz: [0, 0, 0]}
