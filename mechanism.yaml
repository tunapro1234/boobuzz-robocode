# Tek gercek kaynak: sim geometrisi VE gercek robotun koordinat matematigi.
# Java (:core, :sim) ve Python (re-cock-nize) AYNI dosyayi okur.
# Sema ve cerceve kurali docs/protokol.md'de. Dosyada aci DERECE, protokolde RADYAN.
#
# Cerceve: robot +x ILERI, +y SOL, donus CCW pozitif (Pedro/FTC ile ayni).
# Faz 0/1: sadece dort tekerlek. Shooter/turret/tof/limelight eklendiginde
# buraya girer, protokol degismez.

units: {angle: deg}                      # dosyada derece; PROTOKOLDE RADYAN
robot: {width: 18, length: 18}            # ayak izi; duvar kirpma + cizim
drivetrain: {type: mecanum, wheel_diameter: 4.0}
physics:
  battery_v: 12.0
  motor_tau_s: 0.1
  efficiency: {fl: 1.0, fr: 1.0, bl: 1.0, br: 1.0}
  # archive/ftc/de-cock TeamCode pedroPathing/Constants.java (geçen sezon).
  strafe_eff: 0.7346                    # yVelocity/xVelocity = 54.09/73.63
  zero_power_decel_forward_in_s2: 36.17 # |forwardZeroPowerAcceleration|
  zero_power_decel_lateral_in_s2: 85.98 # |lateralZeroPowerAcceleration|
motors:                                   # ad = protokol anahtari
  # pos = [x ileri, y sol] robot cercevesi
  # free_rpm = 73.63 in/s * 60 / (pi * 4 in); doğrudan RPM verisi bulunamadı.
  fl: {drives: wheel, pos: [ 6.5, 5.5], roller: 45,  ticks_per_rev: 537.7, free_rpm: 351.55735379568756, kV: 0.0, kS: 0.0}
  fr: {drives: wheel, pos: [ 6.5,-5.5], roller: -45, ticks_per_rev: 537.7, free_rpm: 351.55735379568756, kV: 0.0, kS: 0.0}
  bl: {drives: wheel, pos: [-6.5, 5.5], roller: -45, ticks_per_rev: 537.7, free_rpm: 351.55735379568756, kV: 0.0, kS: 0.0}
  br: {drives: wheel, pos: [-6.5,-5.5], roller: 45,  ticks_per_rev: 537.7, free_rpm: 351.55735379568756, kV: 0.0, kS: 0.0}
servos: {}
sensors:
  imu: {}
  # Gecen sezonun OLCULMUS Pedro 2.x Constants.java degerleri; yeni saside yeniden olculecek.
  pinpoint: {x_pod_offset_mm: 161.0, y_pod_offset_mm: 0.0,
             x_pod_direction: FORWARD, y_pod_direction: REVERSED,
             pod_type: goBILDA_4_BAR_POD}
