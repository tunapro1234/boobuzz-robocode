# Single source of truth: simulator geometry AND the real robot coordinate math.
# Java (:core, :sim) and Python (re-cock-nize) read the SAME file.
# The schema and frame rules are in the protocol documentation. Angles are DEGREES here, RADIANS in the protocol.
#
# Frame: robot +x FORWARD, +y LEFT, rotation positive CCW (same as Pedro/FTC).
# Phase 0/1: four wheels only. Shooter/turret/tof/limelight can be added here;
# the protocol does not change.

units: {angle: deg}                      # degrees in this file; RADIANS IN THE PROTOCOL
robot: {width: 18, length: 18}            # footprint; wall clipping + drawing
drivetrain: {type: mecanum, wheel_diameter: 4.0}
physics:
  battery_v: 12.0
  motor_tau_s: 0.1
  efficiency: {fl: 1.0, fr: 1.0, bl: 1.0, br: 1.0}
  # archive/ftc/de-cock TeamCode pedroPathing/Constants.java (last season).
  strafe_eff: 0.7346                    # yVelocity/xVelocity = 54.09/73.63
  zero_power_decel_forward_in_s2: 36.17 # |forwardZeroPowerAcceleration|
  zero_power_decel_lateral_in_s2: 85.98 # |lateralZeroPowerAcceleration|
motors:                                   # name = protocol key
  # pos = [x forward, y left] robot frame
  # free_rpm = 73.63 in/s * 60 / (pi * 4 in); no direct RPM data was found.
  fl: {drives: wheel, pos: [ 6.5, 5.5], roller: 45,  ticks_per_rev: 537.7, free_rpm: 351.55735379568756}
  fr: {drives: wheel, pos: [ 6.5,-5.5], roller: -45, ticks_per_rev: 537.7, free_rpm: 351.55735379568756}
  bl: {drives: wheel, pos: [-6.5, 5.5], roller: -45, ticks_per_rev: 537.7, free_rpm: 351.55735379568756}
  br: {drives: wheel, pos: [-6.5,-5.5], roller: 45,  ticks_per_rev: 537.7, free_rpm: 351.55735379568756}
servos: {}
sensors:
  imu: {}
  # MEASURED Pedro 2.x Constants.java values from last season; re-measure on the new chassis.
  pinpoint: {x_pod_offset_mm: 161.0, y_pod_offset_mm: 0.0,
             x_pod_direction: FORWARD, y_pod_direction: REVERSED,
             pod_type: goBILDA_4_BAR_POD}
